<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Visor AR de Proteínas</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>body{margin:0;font-family:sans-serif;text-align:center}model-viewer{width:100%;height:600px;background-color:#f0f0f0;display:block}.controls{padding:20px}</style></head><body><model-viewer id="visor" src="jdomain.glb" ar camera-controls auto-rotate environment-image="neutral" tone-mapping="neutral"><button slot="ar-button" style="padding:10px">Ver en AR</button></model-viewer><div class="controls"><label for="selector">Elegir estructura:</label> <select id="selector"><option value="jdomain.glb" data-exposure="1.0">Dominio 1</option><option value="jdomain2.glb" data-exposure="1.2">Dominio 2</option></select></div><script>const visor=document.querySelector("#visor"),selector=document.querySelector("#selector");selector.addEventListener("input",e=>{const t=e.target.value,r=e.target.options[e.target.selectedIndex];visor.setAttribute("src",t),visor.exposure=r.dataset.exposure})</script></body></html>
