<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>BioARchitect | AR Protein Viewer</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>body{margin:0;font-family:sans-serif;text-align:center}model-viewer{width:100%;height:600px;background-color:#f0f0f0;display:block}.controls{padding:20px}</style></head><body><model-viewer id="viewer" src="jdomain.glb" ar camera-controls auto-rotate environment-image="neutral" tone-mapping="neutral"><button slot="ar-button" style="padding:10px">View in AR</button></model-viewer><div class="controls"><label for="selector">Choose structure:</label> <select id="selector"><option value="jdomain.glb" data-exposure="1.0">Domain 1</option><option value="jdomain2.glb" data-exposure="1.2">Domain 2</option></select></div><script>const viewer=document.querySelector("#viewer"),selector=document.querySelector("#selector");selector.addEventListener("input",e=>{const t=e.target.value,r=e.target.options[e.target.selectedIndex];viewer.setAttribute("src",t),viewer.exposure=r.dataset.exposure}),viewer.addEventListener("ar-status",e=>{"session-started"===e.detail.status&&window.goatcounter&&goatcounter.count({path:"ar-launch",title:"AR started",event:!0})})</script><script data-goatcounter="https://bioarchitect.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
