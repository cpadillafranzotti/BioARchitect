<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>BioARchitect | AR Protein Viewer</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>body{margin:0;font-family:sans-serif;text-align:center}model-viewer{width:100%;height:600px;background-color:#f0f0f0;display:block}.controls{padding:20px}</style></head><body><model-viewer id="viewer" src="jdomain.glb" ar camera-controls auto-rotate environment-image="neutral" tone-mapping="neutral"><button id="ar-button" slot="ar-button" style="padding:10px">View in AR</button></model-viewer><div class="controls"><label for="selector">Choose structure:</label> <select id="selector"><option value="jdomain.glb" data-exposure="1.0">Domain 1</option><option value="jdomain2.glb" data-exposure="1.2">Domain 2</option></select></div><script>const viewer=document.querySelector("#viewer"),selector=document.querySelector("#selector"),arButton=document.querySelector("#ar-button");function countARLaunch(){const e="https://bioarchitect.goatcounter.com/count?p="+encodeURIComponent("ar-launch")+"&t="+encodeURIComponent("AR started")+"&e=true&rnd="+Math.random().toString(36).slice(2);fetch(e,{mode:"no-cors",keepalive:!0}).catch(()=>{})}selector.addEventListener("input",e=>{const t=e.target.value,o=e.target.options[e.target.selectedIndex];viewer.setAttribute("src",t),viewer.exposure=o.dataset.exposure}),arButton.addEventListener("click",e=>{e.stopPropagation(),countARLaunch(),setTimeout(()=>viewer.activateAR(),300)},!0)</script><script data-goatcounter="https://bioarchitect.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
